; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32cam

[env]
platform = espressif32
board = esp32cam
framework = arduino

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Serial Monitor Settings
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Upload Settings (use 115200 if your USB cable or adapter struggles at high baud rates)
upload_speed = 460800

build_unflags =
    -Os

; Build Flags for AI-Thinker PSRAM & Edge Impulse ESP-NN Optimization
build_flags = 
    -O3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1


; 1. Main Project Firmware
[env:esp32cam]
build_src_filter = +<main.cpp>
 
; 2. Gathering Data Firmware
[env:esp32cam_gather]
build_src_filter = +<gather.cpp>